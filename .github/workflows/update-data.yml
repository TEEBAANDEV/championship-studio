name: Actualizar resultados

on:
  schedule:
    # Cada 3 horas de viernes a lunes (fines de semana de carrera)
    - cron: '15 */3 * * 5,6,0,1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar resultados y actualizar archivos
        run: node scripts/update_live_data.js

      - name: Guardar cambios si hay resultados nuevos
        run: |
          if [ -n "$(git status --porcelain data/live)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/live
            git commit -m "Resultados actualizados automáticamente"
            git push
          else
            echo "Sin cambios."
          fi
