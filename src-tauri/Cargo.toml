[package]
name = "championship-studio"
version = "1.0.0"
description = "Championship Studio — gestión de campeonatos, puntos y probabilidades"
authors = ["Teebaan"]
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
fastrand = "2.1"
base64 = "0.22"
rfd = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
